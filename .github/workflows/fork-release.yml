# Builds the container image of this fork and publishes it to the GitHub Container Registry.
#
# To release: publish a GitHub release whose tag looks like v0.15.2-f1, that is the upstream
# version the fork is based on, followed by -f and the number of the fork build. The image is
# pushed as ghcr.io/<owner>/dendrite-monolith:<tag> and nothing else: there is no "latest" tag.
#
# A build can be repeated from the Actions tab with "Run workflow" and the tag of an existing release.
# This workflow needs no secrets; the built-in GITHUB_TOKEN may push to the repository's own packages.

name: "Fork release image"

on:
  release: # A GitHub release was published
    types: [published]
  workflow_dispatch: # A build of an existing tag was requested
    inputs:
      tag:
        description: "Fork release tag to build, e.g. v0.15.2-f1"
        required: true
        type: string

env:
  IMAGE_NAME: dendrite-monolith
  PLATFORMS: linux/amd64

jobs:
  image:
    name: Monolith image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check the release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-f[0-9]+$ ]]; then
            echo "::error::Tag '$tag' is not a fork release tag. Expected something like v0.15.2-f1."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Registry paths must be lower case.
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Get the commit being built
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo
            echo "\`${IMAGE}\`"
            echo
            echo "Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
